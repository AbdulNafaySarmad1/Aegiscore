global
    log stdout format raw local0
    maxconn 4096
defaults
    log global
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
frontend public
    bind :8080
    default_backend university
backend university
    balance roundrobin
    option httpchk GET /api/runtime/ready
    http-check expect status 200
    default-server inter 1s fall 1 rise 2 resolvers docker init-addr libc,none
    server app_a app-a:8080 check
    server app_b app-b:8080 check
