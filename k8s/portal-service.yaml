apiVersion: v1
kind: Service
metadata:
  name: aegiscore-portal
  namespace: aegiscore
spec:
  selector:
    app: aegiscore-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Stable in-cluster name consumed by the portal's reverse-proxy configuration.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aegiscore
spec:
  selector:
    app: aegiscore-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
