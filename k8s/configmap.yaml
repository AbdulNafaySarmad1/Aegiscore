apiVersion: v1
kind: ConfigMap
metadata:
  name: nocturne-api-config
  namespace: nocturne
data:
  ASPNETCORE_URLS: http://+:8080
  AEGISCORE_INSTALLATION_COMPLETED: "true"
  NOCTURNE_STORAGE_PROVIDER: local
  NOCTURNE_STORAGE_LOCAL_PATH: /app/storage
  NOCTURNE_REDIS_CONNECTION: nocturne-redis:6379
  License__ServerUrl: https://license.nocturne.systems
  Database__AutoMigrate: "true"
