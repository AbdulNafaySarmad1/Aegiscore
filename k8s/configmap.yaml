apiVersion: v1
kind: ConfigMap
metadata:
  name: aegiscore-api-config
  namespace: aegiscore
data:
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  AEGISCORE_INSTALLATION_COMPLETED: "true"
  Runtime__DemoMode: "false"
  Deployment__FailOnReadinessError: "true"
  AEGISCORE_CLOUD_PROVIDER: ONPREMISE
  AEGISCORE_SECRET_PROVIDER: INFISICAL
  AEGISCORE_STORAGE_PROVIDER: local
  AEGISCORE_STORAGE_LOCAL_PATH: /app/storage
  DataProtection__KeyPath: /app/config/data-protection
  DataProtection__CertificatePath: /run/aegiscore-secrets/data-protection.pfx
  HybridPqcTransport__Enforce: "true"
  HybridPqcTransport__MaxSkewSeconds: "60"
  License__ServerUrl: https://license.aegiscore.systems
  Database__AutoMigrate: "true"
