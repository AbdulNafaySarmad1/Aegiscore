# AegisCore Runtime Secrets
# This is a PLACEHOLDER — populate values via CI/CD pipeline or kubectl.
# NEVER commit actual secret values to git.
# In production, this Secret is created by the deploy workflow using GitHub Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: aegiscore-runtime-secrets
  namespace: aegiscore
type: Opaque
stringData:
  AEGISCORE_JWT_SECRET: ""
  AEGISCORE_ENCRYPTION_KEY: ""
  AEGISCORE_PQC_KEY_BASE64: ""
  LICENSE_HMAC_SECRET: ""
  TENANT_ID: ""
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: ""
  DB_USER: ""
  DB_PASSWORD: ""
  DB_SSL: "true"
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_TLS: "true"
  INFISICAL_URL: ""
  INFISICAL_TOKEN: ""
  INFISICAL_WORKSPACE_ID: ""
  INFISICAL_ENVIRONMENT: "production"
  AEGISCORE_DATA_PROTECTION_CERTIFICATE_PASSWORD: ""
