apiVersion: v1
kind: ConfigMap
metadata:
  name: aegiscore-postgres-init
  namespace: aegiscore
data:
  010-harden-app-role.sh: |
    #!/bin/sh
    set -eu
    test -n "${APP_DB_USER:-}"
    test -n "${APP_DB_PASSWORD:-}"
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
        --set=app_user="$APP_DB_USER" --set=app_password="$APP_DB_PASSWORD" --set=app_database="$POSTGRES_DB" <<'SQL'
    SELECT format(
        'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS',
        :'app_user', :'app_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_database', :'app_user') \gexec
    SELECT format('GRANT ALL ON SCHEMA public TO %I', :'app_user') \gexec
    SQL
