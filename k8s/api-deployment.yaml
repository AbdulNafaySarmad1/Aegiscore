apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocturne-api
  namespace: nocturne
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nocturne-api
  template:
    metadata:
      labels:
        app: nocturne-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/abdulnafaysarmad1/aegiscore-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nocturne-api-config
            - secretRef:
                name: nocturne-runtime-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
