apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegiscore-api
  namespace: aegiscore
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegiscore-api
  template:
    metadata:
      labels:
        app: aegiscore-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/abdulnafaysarmad1/aegiscore-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegiscore-api-config
            - secretRef:
                name: aegiscore-runtime-secrets
          volumeMounts:
            - name: data-protection-keys
              mountPath: /app/config/data-protection
            - name: data-protection-certificate
              mountPath: /run/aegiscore-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: aegiscore-data-protection
        - name: data-protection-certificate
          secret:
            secretName: aegiscore-data-protection-certificate
            items:
              - key: data-protection.pfx
                path: data-protection.pfx
