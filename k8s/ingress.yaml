apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegiscore
  namespace: aegiscore
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - erp.aegiscore.university.edu.pk
      secretName: aegiscore-tls
  rules:
    - host: erp.aegiscore.university.edu.pk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegiscore-portal
                port:
                  number: 80
