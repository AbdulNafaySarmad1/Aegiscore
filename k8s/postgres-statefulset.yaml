apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegiscore-postgres
  namespace: aegiscore
spec:
  serviceName: aegiscore-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aegiscore-postgres
  template:
    metadata:
      labels:
        app: aegiscore-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: aegiscore
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aegiscore-runtime-secrets
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegiscore-runtime-secrets
                  key: POSTGRES_ADMIN_PASSWORD
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: aegiscore-runtime-secrets
                  key: POSTGRES_USER
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegiscore-runtime-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/010-harden-app-role.sh
              subPath: 010-harden-app-role.sh
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgres-init
          configMap:
            name: aegiscore-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
