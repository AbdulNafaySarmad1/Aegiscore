# -------------------------------------------------------------------
# AegisCore CLOUD demo override
#
# PostgreSQL -> Supabase
# Redis      -> local Docker
# API/Portal -> locally built images
# -------------------------------------------------------------------

services:

  api:
    environment:
      DEPLOYMENT_MODE: cloud
      ASPNETCORE_ENVIRONMENT: "Demo"
      AEGISCORE_INSTALLATION_COMPLETED: "true"
      AEGISCORE_FRONTEND_URL: ${AEGISCORE_FRONTEND_URL}
      Runtime__DemoMode: "true"
      Demo__SeedGoldenUniverse: "false"
      Demo__AllowExplicitExternalSeed: "false"
      AEGISCORE_DB_CONNECTION: ${AEGISCORE_DB_CONNECTION:?AEGISCORE_DB_CONNECTION must be set}
      AEGISCORE_REDIS_CONNECTION: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      Attendance__CampusLatitude: "24.812576"
      Attendance__CampusLongitude: "67.114831"
      Attendance__RadiusMeters: "750"
      Attendance__TimeZone: "Asia/Karachi"

    # PostgreSQL is external. Redis is local and the API restart policy handles
    # the short startup race while Redis becomes healthy.
    depends_on: !reset {}

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  portal:
    environment:
      DEPLOYMENT_MODE: cloud

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL is external (Supabase)
  postgres: !reset null

  # Redis is local for the demo
  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --appendonly
      - "no"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping 2>/dev/null | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped
