name: aegiscore

services:
  portal:
    image: ${AEGISCORE_PORTAL_IMAGE:-aegiscore-portal:local}
    build:
      context: ./AegisCore.Portal
      args:
        - NEXT_PUBLIC_DEMO_MODE=true
    environment:
      AEGISCORE_API_INTERNAL_URL: http://api:8080
    ports:
      - "${AEGISCORE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  api:
    image: ${AEGISCORE_API_IMAGE:-aegiscore-api:local}
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Runtime__DemoMode: ${AEGISCORE_DEMO_MODE:-true}
      AEGISCORE_INSTALLATION_COMPLETED: ${AEGISCORE_INSTALLATION_COMPLETED:-false}
      Database__AutoMigrate: "${AEGISCORE_AUTO_MIGRATE:-true}"
      Deployment__FailOnReadinessError: "true"
      AEGISCORE_CLOUD_PROVIDER: ONPREMISE
      AEGISCORE_SECRET_PROVIDER: ${AEGISCORE_SECRET_PROVIDER:-FILE}
      AEGISCORE_LOCAL_SECRET_PATH: /app/config/secrets/vault.bin
      TENANT_ID: ${TENANT_ID:?Run ./scripts/bootstrap-env.sh first}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-aegiscore}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-aegiscore}}
      DB_PASS: ${DB_PASS:-${POSTGRES_PASSWORD:-}}
      AEGISCORE_DB_CONNECTION: ${AEGISCORE_DB_CONNECTION:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-aegiscore};Username=${POSTGRES_USER:-aegiscore};Password=${POSTGRES_PASSWORD:?Run ./scripts/bootstrap-env.sh first};SslMode=Disable}
      AEGISCORE_REDIS_CONNECTION: redis:6379,password=${REDIS_PASSWORD:?Run ./scripts/bootstrap-env.sh first}
      AEGISCORE_STORAGE_PROVIDER: local
      AEGISCORE_STORAGE_LOCAL_PATH: /app/storage
      License__ServerUrl: ${LICENSE_SERVER_URL:-https://license.aegiscore.systems}
      License__OfflineMode: ${LICENSE_OFFLINE_MODE:-false}
      License__HmacSecret: ${LICENSE_HMAC_SECRET:?Run ./scripts/bootstrap-env.sh first}
      AEGISCORE_ENCRYPTION_KEY: ${AEGISCORE_ENCRYPTION_KEY:?Run ./scripts/bootstrap-env.sh first}
      PQC_MLKEM_PUBLIC_KEY: ${PQC_MLKEM_PUBLIC_KEY:-}
      PQC_MLKEM_PRIVATE_KEY: ${PQC_MLKEM_PRIVATE_KEY:-}
      PQC_MLDSA_PUBLIC_KEY: ${PQC_MLDSA_PUBLIC_KEY:-}
      PQC_MLDSA_PRIVATE_KEY: ${PQC_MLDSA_PRIVATE_KEY:-}
      CF_TURNSTILE_SITE_KEY: ${CF_TURNSTILE_SITE_KEY:-}
      CF_TURNSTILE_SECRET_KEY: ${CF_TURNSTILE_SECRET_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-${ASPNETCORE_ENVIRONMENT:-Production}}
      APP_SECRET: ${APP_SECRET:-}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-900}
      AEGISCORE_SETUP_TOKEN: ${AEGISCORE_SETUP_TOKEN:-}
      AEGISCORE_PQC_KEY_BASE64: ${AEGISCORE_PQC_KEY_BASE64:?Run ./scripts/bootstrap-env.sh first}
      AEGISCORE_JWT_SECRET: ${AEGISCORE_JWT_SECRET:?Run ./scripts/bootstrap-env.sh first}
      Governance__FeedbackEncryptionKeyBase64: ${GOVERNANCE_FEEDBACK_KEY_BASE64:?Run ./scripts/bootstrap-env.sh first}
      HybridPqcTransport__Enforce: ${AEGISCORE_REQUIRE_EDGE_PQC:-false}
      HybridPqcTransport__EdgeProofKeyBase64: ${AEGISCORE_EDGE_PQC_PROOF_KEY_BASE64:-}
      DataProtection__KeyPath: /app/config/data-protection
      DataProtection__CertificatePath: ${AEGISCORE_DATA_PROTECTION_CERTIFICATE_PATH:-}
      DataProtection__CertificatePassword: ${AEGISCORE_DATA_PROTECTION_CERTIFICATE_PASSWORD:-}
      PaymentGateways__raast__BaseUrl: ${RAAST_BASE_URL:-https://api.raast.gov.pk/v1/}
      PaymentGateways__stripe__BaseUrl: ${STRIPE_BASE_URL:-https://api.stripe.com/}
      PaymentGateways__plaid-ach__BaseUrl: ${PLAID_BASE_URL:-https://production.plaid.com/}
      PaymentGateways__gocardless__BaseUrl: ${GOCARDLESS_BASE_URL:-https://api.gocardless.com/}
      PaymentGateways__billplz-fpx__BaseUrl: ${BILLPLZ_BASE_URL:-https://www.billplz.com/}
      PaymentGateways__duitnow-qr__BaseUrl: ${DUITNOW_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ENDPOINT: ${AI_ENDPOINT:-http://host.docker.internal:11434/}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      AI_API_KEY: ${AI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped
    networks:
      - edge
      - backend
    volumes:
      - api_storage:/app/storage
      - api_config:/app/config
      - ./.aegiscore:/run/aegiscore-secrets:ro
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiscore}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-aegiscore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-${POSTGRES_PASSWORD:?Run ./scripts/bootstrap-env.sh first}}
      APP_DB_USER: ${POSTGRES_USER:-aegiscore}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/bootstrap-env.sh first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init/010-harden-app-role.sh:/docker-entrypoint-initdb.d/010-harden-app-role.sh:ro
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run ./scripts/bootstrap-env.sh first}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run ./scripts/bootstrap-env.sh first}
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  api_storage:
  api_config:
