services:
  api:
    image: aegiscore-api:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      Setup__Mode: "false"
      AEGISCORE_INSTALLATION_COMPLETED: "true"
      Database__AutoMigrate: "true"
      NOCTURNE_DB_CONNECTION: ${NOCTURNE_DB_CONNECTION:?Set NOCTURNE_DB_CONNECTION in .env or pass --env-file .env.example}
      NOCTURNE_REDIS_CONNECTION: ${NOCTURNE_REDIS_CONNECTION:-redis:6379}
      NOCTURNE_STORAGE_PROVIDER: ${NOCTURNE_STORAGE_PROVIDER:-local}
      NOCTURNE_STORAGE_LOCAL_PATH: ${NOCTURNE_STORAGE_LOCAL_PATH:-/app/storage}
      NOCTURNE_LICENSE_SERVER_URL: ${NOCTURNE_LICENSE_SERVER_URL:-https://license.nocturne.systems}
      NOCTURNE_ENCRYPTION_KEY: ${NOCTURNE_ENCRYPTION_KEY:?Set NOCTURNE_ENCRYPTION_KEY in .env or pass --env-file .env.example}
      NOCTURNE_PQC_KEY_BASE64: ${NOCTURNE_PQC_KEY_BASE64:?Set NOCTURNE_PQC_KEY_BASE64 in .env or pass --env-file .env.example}
      NOCTURNE_JWT_SECRET: ${NOCTURNE_JWT_SECRET:?Set NOCTURNE_JWT_SECRET in .env or pass --env-file .env.example}
      Governance__FeedbackEncryptionKeyBase64: ${Governance__FeedbackEncryptionKeyBase64:?Set Governance__FeedbackEncryptionKeyBase64 in .env or pass --env-file .env.example}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nocturne}
      POSTGRES_USER: ${POSTGRES_USER:-nocturne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or pass --env-file .env.example}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturne -d nocturne"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
