<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AegisCore Guided Setup</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#111e30;--line:#263b55;--text:#e8f0f8;--muted:#9bb0c5;--brand:#5ba4ff;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#132b49 0,var(--bg) 34%);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
    button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}.brand span{color:var(--brand)}
    .progress{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:24px 0}.progress button{min-width:0;padding:9px 5px;border:1px solid var(--line);border-radius:10px;background:#0b1727;color:var(--muted);font-size:12px}
    .progress button.active{background:var(--brand);border-color:var(--brand);color:#041526}.progress button.done{border-color:var(--ok);color:var(--ok)}
    .card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 45px #0005}h1{margin:0 0 4px;font-size:25px}h2{margin:24px 0 10px;font-size:17px}.sub,.hint{color:var(--muted)}
    label{display:grid;gap:5px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    input,select{width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;background:#091526;color:var(--text);padding:9px 11px}input:focus,select:focus,button:focus-visible{outline:3px solid #5ba4ff66;outline-offset:2px}
    button,.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 15px;border:1px solid var(--line);border-radius:9px;background:#15273d;color:var(--text);font-weight:700;cursor:pointer;text-decoration:none}
    button.primary,.button.primary{background:var(--brand);border-color:var(--brand);color:#041526}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.right{display:flex;gap:10px}
    .notice{padding:11px 13px;margin:12px 0;border-radius:9px;border:1px solid var(--line);background:#0b1727}.notice.ok{border-color:#34d39966;color:var(--ok)}.notice.bad{border-color:#fb718566;color:var(--bad)}.notice.warn{border-color:#fbbf2466;color:var(--warn)}
    .templates,.uploads,.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{border:1px solid var(--line);background:#0b1727;border-radius:12px;padding:15px}.tile h3{margin:0 0 5px;text-transform:capitalize}.tile ul{padding-left:18px;color:var(--muted);font-size:13px;min-height:58px}.tile input[type=file]{padding:7px}
    .tree{display:grid;gap:14px;text-align:center;margin:20px 0}.node{display:inline-block;border:1px solid var(--brand);border-radius:10px;padding:10px 14px;background:#102541}.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.dept{position:relative}.dept:before{content:"";display:block;width:1px;height:14px;background:var(--line);margin:-14px auto 5px}
    .department-row{display:grid;grid-template-columns:1fr 110px 1fr 46px;gap:8px;margin:8px 0}.matrix{overflow:auto}.matrix table{width:100%;border-collapse:collapse}.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--line);text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:left}.matrix input{width:18px;min-height:18px}
    .checks{display:grid;gap:8px}.check{display:flex;justify-content:space-between;gap:15px;padding:11px;border:1px solid var(--line);border-radius:9px}.pass{color:var(--ok)}.fail{color:var(--bad)}.hidden{display:none!important}
    @media(max-width:760px){.progress{grid-template-columns:repeat(2,1fr)}.grid,.grid.three,.department-row{grid-template-columns:1fr}.shell{padding:16px 10px}.card{padding:17px}.actions{align-items:stretch}.actions,.right{flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
<main class="shell">
  <div class="brand">◆ <span>AegisCore</span> University Setup</div>
  <nav class="progress" id="progress" aria-label="Setup progress"></nav>
  <section class="card" id="screen" aria-live="polite"></section>
</main>
<script>
const labels=["University","Database","Templates","Hierarchy","Upload","Permissions","Review"];
const requiredUploads=["departments","students","faculty","courses"];
const allUploads=["students","faculty","courses","departments","attendance","marks","financial"];
let step=0, hierarchy={viceChancellor:"",departments:[]}, permissions=[], uploadResults={};
const $=id=>document.getElementById(id);
const value=id=>$(id)?.value?.trim()||"";
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path,options={}){
  const response=await fetch("/api/setup"+path,options);
  const type=response.headers.get("content-type")||"";
  const data=type.includes("json")?await response.json():await response.text();
  if(!response.ok)throw new Error(data?.error||data?.userMessage||data?.errors?.join?.(" ")||`Request failed (${response.status})`);
  return data;
}
const json=body=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
const notice=(kind,text)=>`<div class="notice ${kind}">${escapeHtml(text)}</div>`;
function drawProgress(){ $("progress").innerHTML=labels.map((x,i)=>`<button class="${i===step?"active":i<step?"done":""}" ${i>step?"disabled":""} onclick="go(${i})">${i+1}. ${x}</button>`).join("") }
function go(next){step=next;drawProgress();render()}
function nav(canNext=true){return `<div class="actions"><button ${step===0?"class=hidden":""} onclick="go(${step-1})">← Back</button><div class="right">${step<6?`<button class="primary" ${canNext?"":"disabled"} onclick="go(${step+1})">Continue →</button>`:""}</div></div>`}

function render(){
  const views=[university,database,templates,hierarchyView,uploads,permissionView,review];
  $("screen").innerHTML=views[step](); if(step===2)loadTemplates(); if(step===5)loadPermissions(); if(step===6)loadReview();
}
function university(){return `<h1>University information</h1><p class="sub">Identity, licensing, public domain, and the first administrator.</p>
  <div class="grid"><label>Full university name<input id="uniName" placeholder="Sir Syed University of Engineering & Technology"></label><label>Short name<input id="uniShort" placeholder="SSUET"></label>
  <label>Website domain<input id="domain" placeholder="ssuet.edu.pk"></label><label>License key<input id="license" placeholder="AE-XXXX-XXXX-XXXX"></label>
  <label>Administrator name<input id="adminName" placeholder="System Administrator"></label><label>Administrator email<input id="adminEmail" type="email" placeholder="admin@university.edu.pk"></label>
  <label>Administrator password<input id="adminPassword" type="password" autocomplete="new-password"></label><label>Confirm password<input id="adminConfirm" type="password" autocomplete="new-password"></label></div>
  <button class="primary" onclick="saveUniversity()">Validate & save</button><div id="result"></div>${nav(false)}`}
async function saveUniversity(){try{
  if(value("adminPassword").length<12||value("adminPassword")!==value("adminConfirm"))throw new Error("Use a matching administrator password of at least 12 characters.");
  const license=await api("/step5/license-info",json({licenseKey:value("license"),institutionName:value("uniName"),organization:value("uniShort"),administratorEmail:value("adminEmail")}));
  if(!license.isValid)throw new Error(license.error?.userMessage||"License validation failed.");
  await api("/step6/administrator",json({fullName:value("adminName"),email:value("adminEmail"),password:value("adminPassword"),confirmPassword:value("adminConfirm")}));
  await api("/step9/domain",json({domain:value("domain")})); $("result").innerHTML=notice("ok","University, license, administrator, and domain saved."); setTimeout(()=>go(1),500);
}catch(e){$("result").innerHTML=notice("bad",e.message)}}

function database(){return `<h1>Infrastructure connections</h1><p class="sub">Test PostgreSQL, Redis, and outgoing email before continuing.</p>
  <h2>PostgreSQL</h2><div class="grid three"><label>Host<input id="dbHost" value="postgres"></label><label>Port<input id="dbPort" type="number" value="5432"></label><label>Database<input id="dbName" value="aegiscore"></label><label>Username<input id="dbUser" value="aegiscore"></label><label>Password<input id="dbPass" type="password"></label><label><span>SSL</span><select id="dbSsl"><option value="true">Required</option><option value="false">Disabled (local only)</option></select></label></div>
  <h2>Redis</h2><div class="grid three"><label>Host<input id="redisHost" value="redis"></label><label>Port<input id="redisPort" type="number" value="6379"></label><label>Password (optional)<input id="redisPass" type="password"></label></div>
  <h2>Email</h2><div class="grid three"><label>SMTP host<input id="smtpHost"></label><label>Port<input id="smtpPort" type="number" value="587"></label><label>Username<input id="smtpUser"></label><label>Password<input id="smtpPass" type="password"></label><label>From address<input id="smtpFrom" type="email"></label><label>From name<input id="smtpName" value="AegisCore"></label></div>
  <button class="primary" onclick="testConnections()">Test all connections</button><div id="result"></div>${nav(false)}`}
async function testConnections(){try{
  const db=await api("/step3/test-postgres",json({host:value("dbHost"),port:+value("dbPort"),databaseName:value("dbName"),username:value("dbUser"),password:value("dbPass"),sslEnabled:value("dbSsl")==="true"}));
  const redis=await api("/step4/test-redis",json({host:value("redisHost"),port:+value("redisPort"),password:value("redisPass")||null,tlsEnabled:false,testConnection:true}));
  const smtp=await api("/step7/test-smtp",json({host:value("smtpHost"),port:+value("smtpPort"),username:value("smtpUser"),password:value("smtpPass"),fromAddress:value("smtpFrom"),fromName:value("smtpName"),testConnection:true}));
  if(!db.success||!redis.success||!smtp.success)throw new Error(db.error?.userMessage||redis.error?.userMessage||smtp.error?.userMessage||"One or more connection tests failed.");
  $("result").innerHTML=notice("ok",`${db.message} · ${redis.message} · ${smtp.message}`);setTimeout(()=>go(2),600);
}catch(e){$("result").innerHTML=notice("bad",e.message)}}

function templates(){return `<h1>Download data templates</h1><p class="sub">Use these exact formats. Each workbook includes headers and a valid example row.</p><p><a class="button primary" href="/api/setup/enhanced/templates/all">Download all templates (.zip)</a></p><div class="templates" id="templateGrid"></div>${nav()}`}
async function loadTemplates(){try{const list=await api("/enhanced/templates");$("templateGrid").innerHTML=list.map(t=>`<article class="tile"><h3>${escapeHtml(t.displayName)}</h3><div class="hint">${t.columns.length} required columns · up to 50,000 rows</div><ul>${t.rules.map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ul><a class="button" href="/api/setup/enhanced/templates/${encodeURIComponent(t.key)}">Download .xlsx</a></article>`).join("")}catch(e){$("templateGrid").innerHTML=notice("bad",e.message)}}

function hierarchyView(){return `<h1>Organizational hierarchy</h1><p class="sub">This structure controls department boundaries and permission scope.</p>
  <label>Vice Chancellor<input id="vc" value="${escapeHtml(hierarchy.viceChancellor)}" placeholder="Vice Chancellor name"></label><div id="departmentRows"></div>
  <button onclick="addDepartment()">＋ Add department</button><button class="primary" onclick="saveHierarchy()">Save & visualize</button><div id="result"></div><div class="tree" id="tree"></div>${nav(false)}`}
function addDepartment(){hierarchy.departments.push({id:crypto.randomUUID(),name:"",code:"",hodName:"",facultyCount:0});drawDepartments()}
function drawDepartments(){if(!$("departmentRows"))return;$("departmentRows").innerHTML=hierarchy.departments.map((d,i)=>`<div class="department-row"><input aria-label="Department name" placeholder="Department name" value="${escapeHtml(d.name)}" oninput="hierarchy.departments[${i}].name=this.value"><input aria-label="Code" placeholder="Code" value="${escapeHtml(d.code)}" oninput="hierarchy.departments[${i}].code=this.value"><input aria-label="HOD name" placeholder="HOD name" value="${escapeHtml(d.hodName||"")}" oninput="hierarchy.departments[${i}].hodName=this.value"><button aria-label="Remove department" onclick="hierarchy.departments.splice(${i},1);drawDepartments()">×</button></div>`).join("")}
function drawTree(){const tree=$("tree");if(!tree)return;tree.innerHTML=`<div><span class="node">Vice Chancellor<br>${escapeHtml(hierarchy.viceChancellor)}</span></div><div class="branches">${hierarchy.departments.map(d=>`<div class="dept"><span class="node">${escapeHtml(d.name)} (${escapeHtml(d.code)})<br><small>HOD: ${escapeHtml(d.hodName||"TBD")}</small></span></div>`).join("")}</div>`}
async function saveHierarchy(){try{hierarchy.viceChancellor=value("vc");hierarchy=await api("/enhanced/hierarchy",json(hierarchy));drawDepartments();drawTree();$("result").innerHTML=notice("ok","Hierarchy saved and audited.");setTimeout(()=>go(4),600)}catch(e){$("result").innerHTML=notice("bad",e.message)}}

function uploads(){return `<h1>Upload and validate data</h1><p class="sub">Master files marked required must pass before go-live. Optional transactional files may be imported later.</p><div class="uploads">${allUploads.map(type=>`<article class="tile"><h3>${type}${requiredUploads.includes(type)?" *":""}</h3><input id="file-${type}" type="file" accept=".xlsx,.csv"><button onclick="validateFile('${type}')">Validate file</button><div id="status-${type}">${uploadResults[type]?uploadStatus(uploadResults[type]):""}</div></article>`).join("")}</div>${nav(requiredUploads.every(x=>uploadResults[x]?.isValid))}`}
function uploadStatus(r){return notice(r.isValid?"ok":"bad",r.isValid?`Valid: ${r.rowCount} rows`:`${r.errors?.length||0} errors: ${(r.errors||[]).slice(0,3).join(" ")}`)}
async function validateFile(type){const file=$(`file-${type}`).files[0];if(!file){$(`status-${type}`).innerHTML=notice("bad","Choose a .xlsx or .csv file.");return}const form=new FormData();form.append("file",file);try{const result=await api(`/enhanced/uploads/${type}/validate`,{method:"POST",body:form});uploadResults[type]=result;$(`status-${type}`).innerHTML=uploadStatus(result);render()}catch(e){$(`status-${type}`).innerHTML=notice("bad",e.message)}}

function permissionView(){return `<h1>Role-based permissions</h1><p class="sub">Start with safe defaults, then customize what VC, HOD, faculty, and students can access.</p><div class="matrix" id="matrix">Loading matrix…</div><button class="primary" onclick="savePermissions()">Apply permissions</button><div id="result"></div>${nav(false)}`}
async function loadPermissions(){try{if(!permissions.length)permissions=await api("/enhanced/permissions");drawPermissions()}catch(e){$("matrix").innerHTML=notice("bad",e.message)}}
function drawPermissions(){const roles=["VC","HOD","Faculty","Student"],features=[...new Set(permissions.map(x=>x.feature))];$("matrix").innerHTML=`<table><thead><tr><th>Feature</th>${roles.map(r=>`<th>${r}</th>`).join("")}</tr></thead><tbody>${features.map(f=>`<tr><td>${escapeHtml(f)}</td>${roles.map(r=>{const i=permissions.findIndex(x=>x.role===r&&x.feature===f),p=permissions[i];return `<td><input type="checkbox" ${p?.allowed?"checked":""} onchange="permissions[${i}].allowed=this.checked" aria-label="${escapeHtml(r+" "+f)}"></td>`}).join("")}</tr>`).join("")}</tbody></table>`}
async function savePermissions(){try{permissions=await api("/enhanced/permissions",json({permissions}));$("result").innerHTML=notice("ok","Permission matrix applied and audited.");setTimeout(()=>go(6),600)}catch(e){$("result").innerHTML=notice("bad",e.message)}}

function review(){return `<h1>Review and go live</h1><p class="sub">AegisCore will not activate until every critical check passes.</p><div class="checks" id="checks">Running checks…</div><div id="summary"></div><div class="actions"><button onclick="go(5)">← Back</button><div class="right"><button onclick="loadReview()">Run tests again</button><button class="primary" id="live" disabled onclick="goLive()">Create backup & go live</button></div></div><div id="result"></div>`}
async function loadReview(){try{const r=await api("/enhanced/review");$("checks").innerHTML=r.checks.map(x=>`<div class="check"><span>${escapeHtml(x.name)}<small class="hint"> · ${escapeHtml(x.detail)}</small></span><strong class="${x.passed?"pass":"fail"}">${x.passed?"PASS":"FIX"}</strong></div>`).join("");$("summary").innerHTML=notice(r.ready?"ok":"warn",r.ready?"All critical setup checks passed.":"Complete every failed check before go-live.");$("live").disabled=!r.ready}catch(e){$("checks").innerHTML=notice("bad",e.message)}}
async function goLive(){try{const r=await api("/step10/install",json({skipOptionalIntegrations:true}));$("result").innerHTML=notice(r.success?"ok":"bad",r.success?`Deployment activated at ${r.erpUrl}. Restart the container once to enter production mode.`:"Go-live checks failed.")}catch(e){$("result").innerHTML=notice("bad",e.message)}}

drawProgress();render();if(!hierarchy.departments.length)addDepartment();
</script>
</body>
</html>
