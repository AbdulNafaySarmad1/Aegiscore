# Android Play Store Deployment
# Required GitHub Secrets:
#   PLAY_STORE_SERVICE_ACCOUNT_JSON — Google Play Console service account key (JSON)
#   AEGISCORE_KEYSTORE_BASE64       — base64-encoded release.jks keystore file
#   AEGISCORE_KEYSTORE_PASSWORD     — keystore password
#   AEGISCORE_KEY_ALIAS             — key alias (default: aegiscore)
#   AEGISCORE_KEY_PASSWORD          — key password
name: Android Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode and install keystore
        env:
          KEYSTORE_B64: ${{ secrets.AEGISCORE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            echo "AEGISCORE_KEYSTORE_PATH=$(pwd)/keystore/release.jks" >> $GITHUB_ENV
          else
            echo "::warning::AEGISCORE_KEYSTORE_BASE64 secret not set — using debug keystore (Play Store submission will fail)"
          fi

      - name: Build signed release bundle
        run: ./gradlew bundleRelease
        env:
          AEGISCORE_KEYSTORE_PATH: ${{ env.AEGISCORE_KEYSTORE_PATH }}
          AEGISCORE_KEYSTORE_PASSWORD: ${{ secrets.AEGISCORE_KEYSTORE_PASSWORD }}
          AEGISCORE_KEY_ALIAS: ${{ secrets.AEGISCORE_KEY_ALIAS }}
          AEGISCORE_KEY_PASSWORD: ${{ secrets.AEGISCORE_KEY_PASSWORD }}

      - name: Verify AAB exists
        run: ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: pk.edu.aegiscore.mobile
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
