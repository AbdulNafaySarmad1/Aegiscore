# Compliance AC-13 / AC-55: dependency advisories reach the repository as pull requests instead
# of waiting for someone to run an audit by hand. Grouped so a week's worth of patch bumps is one
# PR per ecosystem; security updates are always opened immediately regardless of the schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /AegisCore.Portal
    schedule: { interval: weekly, day: monday }
    groups:
      portal-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /AegisCore.Mobile
    schedule: { interval: weekly, day: monday }
    groups:
      mobile-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /services/aegiscore-clip
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /services/aegiscore-clip
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
