# -----------------------------------------------------------------------------
# AegisCore — Release Workflow
# Triggered on push to main or manual workflow_dispatch.
# Builds and pushes multi-tagged (SHA + :latest) Docker images to GHCR,
# then creates a GitHub Release with auto-generated notes and image references.
#
# Required GitHub Secrets:
#   GHCR_TOKEN — Personal access token (classic) with write:packages scope.
# -----------------------------------------------------------------------------

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API image
        run: |
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/aegiscore-api:${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/aegiscore-api:latest" \
            .
          docker push "ghcr.io/${{ github.repository_owner }}/aegiscore-api:${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/aegiscore-api:latest"

      - name: Build and push Portal image
        run: |
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/aegiscore-portal:${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/aegiscore-portal:latest" \
            AegisCore.Portal
          docker push "ghcr.io/${{ github.repository_owner }}/aegiscore-portal:${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/aegiscore-portal:latest"

  create-release:
    name: Create GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release Notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.sha }}
          name: Release ${{ github.sha }}
          generate_release_notes: true
          body: |
            ## Container Images

            | Image | Tags |
            |-------|------|
            | `aegiscore-api` | `${{ github.sha }}`, `latest` |
            | `aegiscore-portal` | `${{ github.sha }}`, `latest` |

            **Pull commands:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/aegiscore-api:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository_owner }}/aegiscore-portal:${{ github.sha }}
            ```
