# -----------------------------------------------------------------------------
# AegisCore — Continuous Integration Workflow
# Runs on every push and on pull requests targeting main.
# Validates backend build+tests, frontend build+typecheck, and Docker builds.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AegisCore.slnx

      # Compliance AC-13: any package with a known advisory (direct or transitive) fails the build.
      # Exceptions are recorded, with a review date, in docs/compliance/12-vulnerability-register.md.
      - name: Dependency vulnerability audit (NuGet)
        run: |
          dotnet list AegisCore.slnx package --vulnerable --include-transitive > nuget-audit.txt
          cat nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found — see docs/compliance/12-vulnerability-register.md"
            exit 1
          fi

      - name: Build
        run: dotnet build AegisCore.slnx -c Release

      - name: Verify tenant isolation
        run: dotnet test AegisCore.Tests/AegisCore.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~TenantIsolationTest" --verbosity normal -m:1 -p:BuildInParallel=false

      - name: Test
        run: dotnet test AegisCore.Tests/AegisCore.Tests.csproj --no-build --configuration Release --verbosity normal -m:1 -p:BuildInParallel=false

  build-frontend:
    name: Build & Typecheck (Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AegisCore.Portal/package-lock.json

      - name: Install
        working-directory: AegisCore.Portal
        run: npm ci

      - name: Dependency vulnerability audit (npm, production dependencies)
        working-directory: AegisCore.Portal
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: AegisCore.Portal
        run: npx tsc --noEmit

      - name: Build
        working-directory: AegisCore.Portal
        run: npm run build

  docker-verify:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t aegiscore-api:ci-test .

      - name: Build Portal image
        run: docker build -t aegiscore-portal:ci-test AegisCore.Portal

      # Compliance AC-13: the shipped images are scanned for OS and library CVEs. Critical and
      # high findings with a fix available fail the build; unfixable ones are reported only.
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegiscore-api:ci-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Portal image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegiscore-portal:ci-test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
  database-migrations:
    name: Database Migration (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgres
            image: postgres:17-alpine
            host_port: 15432
            container_port: 5432
            project: AegisCore.Infrastructure/AegisCore.Infrastructure.csproj
            connection: Host=localhost;Port=15432;Database=aegiscore;Username=aegiscore;Password=local-only;SSL Mode=Disable
            health_options: >-
              --health-cmd "pg_isready -U aegiscore -d aegiscore"
              --health-interval 10s --health-timeout 5s --health-retries 20
          - dialect: mysql
            image: mysql:8.4
            host_port: 13306
            container_port: 3306
            project: AegisCore.Migrations.MySql/AegisCore.Migrations.MySql.csproj
            connection: Server=localhost;Port=13306;Database=aegiscore;User ID=aegiscore;Password=local-only;SslMode=Disabled;AllowPublicKeyRetrieval=True
            health_options: >-
              --health-cmd "mysqladmin ping -h localhost -uaegiscore -plocal-only"
              --health-interval 10s --health-timeout 5s --health-retries 30
          - dialect: mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
            host_port: 11433
            container_port: 1433
            project: AegisCore.Migrations.MsSql/AegisCore.Migrations.MsSql.csproj
            connection: Server=localhost,11433;Database=aegiscore;User ID=sa;Password=LocalOnly_Passw0rd!;Encrypt=False;TrustServerCertificate=True
            health_options: >-
              --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P LocalOnly_Passw0rd! -C -Q 'SELECT 1' || exit 1"
              --health-interval 10s --health-timeout 5s --health-retries 30
          - dialect: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            host_port: 11521
            container_port: 1521
            project: AegisCore.Migrations.Oracle/AegisCore.Migrations.Oracle.csproj
            connection: User Id=aegiscore;Password=local-only;Data Source=localhost:11521/FREEPDB1
            health_options: >-
              --health-cmd healthcheck.sh
              --health-interval 10s --health-timeout 5s --health-retries 60

    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - "${{ matrix.host_port }}:${{ matrix.container_port }}"
        env:
          POSTGRES_DB: aegiscore
          POSTGRES_USER: aegiscore
          POSTGRES_PASSWORD: local-only
          MYSQL_DATABASE: aegiscore
          MYSQL_USER: aegiscore
          MYSQL_PASSWORD: local-only
          MYSQL_ROOT_PASSWORD: local-root-only
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LocalOnly_Passw0rd!
          ORACLE_PASSWORD: local-root-only
          APP_USER: aegiscore
          APP_USER_PASSWORD: local-only
        options: ${{ matrix.health_options }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution and EF tool
        run: |
          dotnet restore AegisCore.slnx
          dotnet tool restore

      - name: Build migration startup
        run: dotnet build AegisCore.API/AegisCore.API.csproj --configuration Release --no-restore

      - name: Apply ${{ matrix.dialect }} migrations
        env:
          AEGISCORE_SETUP_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_DIALECT: ${{ matrix.dialect }}
          AEGISCORE_DB_CONNECTION: ${{ matrix.connection }}
        run: >-
          dotnet tool run dotnet-ef database update
          --project ${{ matrix.project }}
          --startup-project AegisCore.API/AegisCore.API.csproj
          --context AegisDbContext
          --configuration Release
          --no-build

      # Backup / restore drill (docs/compliance/04, AC-36/37/70): an encrypted backup of the freshly
      # migrated schema is restored into a second database and checked. Runs inside a postgres:17
      # container so the client tools match the server. A failing restore fails the build.
      - name: Backup and restore drill
        if: matrix.dialect == 'postgres'
        run: >-
          docker run --rm --network host
          -v "$PWD/deploy/scripts:/scripts:ro"
          -e DB_HOST=127.0.0.1 -e DB_PORT=15432
          -e POSTGRES_USER=aegiscore -e POSTGRES_PASSWORD=local-only -e POSTGRES_DB=aegiscore
          -e BACKUP_ENCRYPTION_KEY=ci-only-drill-key-not-a-secret
          postgres:17-alpine
          sh -c "apk add -q openssl bash && bash /scripts/backup-restore-drill.sh"


  sidecar-audit:
    name: Python sidecar vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          # Must match services/aegiscore-clip/Dockerfile (python:3.11-slim): the pinned torch build
          # only resolves for the interpreter the image actually runs.
          python-version: '3.11'
      # Compliance AC-13 / register item V-007: the sidecar's dependencies ship in a client image
      # and had never been audited. pip-audit resolves the pinned set and fails on a known advisory.
      - name: Audit pinned requirements
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement services/aegiscore-clip/requirements.txt --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu --strict --progress-spinner off


  accessibility-check:
    name: WCAG 2.1 AA (Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AegisCore.Portal/package-lock.json

      - name: Install Portal dependencies
        working-directory: AegisCore.Portal
        run: npm ci

      - name: Install Chromium
        working-directory: AegisCore.Portal
        run: npx playwright install --with-deps chromium

      - name: Run axe and keyboard accessibility checks
        working-directory: AegisCore.Portal
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run test:accessibility:ci

      - name: Upload accessibility violation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            AegisCore.Portal/accessibility-reports/
            AegisCore.Portal/playwright-report/
          if-no-files-found: error
          retention-days: 14
