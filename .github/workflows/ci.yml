# -----------------------------------------------------------------------------
# AegisCore — Continuous Integration Workflow
# Runs on every push and on pull requests targeting main.
# Validates backend build+tests, frontend build+typecheck, and Docker builds.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AegisCore.slnx

      - name: Apply P5 environment substitution fix and audit
        id: p5
        if: ${{ github.event_name == 'push' && github.ref_name == 'aegiscore/p1-compile-fixes' && hashFiles('reports/p3b/complete.json') != '' && hashFiles('reports/p5/complete.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_p5.py
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build AegisCore.slnx -c Release --no-restore -m:1 -p:BuildInParallel=false

      - name: Test
        run: dotnet test AegisCore.Tests/AegisCore.Tests.csproj --no-build -c Release --verbosity normal -m:1 -p:BuildInParallel=false

      - name: Commit verified P5 changes
        if: ${{ steps.p5.outputs.applied == 'true' && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AegisCore.API/Program.cs \
            AegisCore.Tests/Infrastructure/EnvironmentSubstitutionTest.cs \
            reports/p5

          if git diff --cached --quiet; then
            echo "No P5 changes to commit."
            exit 0
          fi

          git commit -m "fix(P5): wire environment substitution and audit guards [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve tenant-isolation verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-report
          path: '**/tenant-isolation-report.*'
          if-no-files-found: warn
          retention-days: 7

  build-frontend:
    name: Build & Typecheck (Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AegisCore.Portal/package-lock.json

      - name: Install
        working-directory: AegisCore.Portal
        run: npm ci

      - name: Typecheck
        working-directory: AegisCore.Portal
        run: npx tsc --noEmit

      - name: Build
        working-directory: AegisCore.Portal
        run: npm run build

  docker-verify:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t aegiscore-api:ci-test .

      - name: Build Portal image
        run: docker build -t aegiscore-portal:ci-test AegisCore.Portal
