# -----------------------------------------------------------------------------
# AegisCore — Continuous Integration Workflow
# Runs on every push and on pull requests targeting main.
# Validates backend build+tests, frontend build+typecheck, and Docker builds.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AegisCore.slnx

      - name: Build
        run: dotnet build AegisCore.slnx -c Release --no-restore -m:1 -p:BuildInParallel=false

      - name: Test
        run: dotnet test AegisCore.Tests/AegisCore.Tests.csproj --no-build -c Release --verbosity normal -m:1 -p:BuildInParallel=false

      - name: Preserve tenant-isolation discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-report
          path: '**/tenant-isolation-report.*'
          if-no-files-found: warn
          retention-days: 7

      - name: Persist P3A report to working branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          JSON_REPORT="$(find . -type f -name tenant-isolation-report.json -print -quit)"
          TXT_REPORT="$(find . -type f -name tenant-isolation-report.txt -print -quit)"

          if [ -z "$JSON_REPORT" ]; then
            echo "No tenant isolation JSON report was produced."
            exit 0
          fi

          mkdir -p reports/p3a
          cp "$JSON_REPORT" reports/p3a/tenant-isolation-report.json
          if [ -n "$TXT_REPORT" ]; then
            cp "$TXT_REPORT" reports/p3a/tenant-isolation-report.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/p3a/tenant-isolation-report.json
          if [ -f reports/p3a/tenant-isolation-report.txt ]; then
            git add reports/p3a/tenant-isolation-report.txt
          fi

          if git diff --cached --quiet; then
            echo "P3A report unchanged."
            exit 0
          fi

          git commit -m "chore(P3A): persist tenant isolation report [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-frontend:
    name: Build & Typecheck (Portal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AegisCore.Portal/package-lock.json

      - name: Install
        working-directory: AegisCore.Portal
        run: npm ci

      - name: Typecheck
        working-directory: AegisCore.Portal
        run: npx tsc --noEmit

      - name: Build
        working-directory: AegisCore.Portal
        run: npm run build

  docker-verify:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t aegiscore-api:ci-test .

      - name: Build Portal image
        run: docker build -t aegiscore-portal:ci-test AegisCore.Portal
