apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegiscore-api
  namespace: aegiscore
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegiscore-api
  template:
    metadata:
      labels:
        app: aegiscore-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/${GITHUB_REPOSITORY}/aegiscore-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegiscore-api-config
            - secretRef:
                name: aegiscore-runtime-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
