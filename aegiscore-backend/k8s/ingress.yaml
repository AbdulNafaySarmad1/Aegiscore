apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegiscore-api
  namespace: aegiscore
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.aegiscore.university.edu.pk
      secretName: aegiscore-api-tls
  rules:
    - host: api.aegiscore.university.edu.pk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegiscore-api
                port:
                  number: 80
