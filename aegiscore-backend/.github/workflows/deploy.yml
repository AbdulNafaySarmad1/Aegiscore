name: Deploy AegisCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_ENABLED: ${{ secrets.KUBE_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        run: dotnet test AegisCore.Tests/AegisCore.Tests.csproj -m:1 -p:BuildInParallel=false

      - name: Portal build
        working-directory: AegisCore.Portal
        run: npm ci && npm run build

      - name: Mobile typecheck
        working-directory: AegisCore.Mobile
        run: npm ci && npm run typecheck

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        run: |
          docker build -t ghcr.io/${{ github.repository }}/aegiscore-api:${IMAGE_TAG} .
          docker push ghcr.io/${{ github.repository }}/aegiscore-api:${IMAGE_TAG}

      - name: Deploy to Kubernetes
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          AEGISCORE_DB_CONNECTION: ${{ secrets.AEGISCORE_DB_CONNECTION }}
          AEGISCORE_JWT_SECRET: ${{ secrets.AEGISCORE_JWT_SECRET }}
          LICENSE_HMAC_SECRET: ${{ secrets.LICENSE_HMAC_SECRET }}
          AEGISCORE_PQC_KEY_BASE64: ${{ secrets.AEGISCORE_PQC_KEY_BASE64 }}
          Governance__FeedbackEncryptionKeyBase64: ${{ secrets.GOVERNANCE_FEEDBACK_KEY_BASE64 }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n aegiscore create secret generic aegiscore-runtime-secrets \
            --from-literal=AEGISCORE_DB_CONNECTION="$AEGISCORE_DB_CONNECTION" \
            --from-literal=AEGISCORE_JWT_SECRET="$AEGISCORE_JWT_SECRET" \
            --from-literal=License__HmacSecret="$LICENSE_HMAC_SECRET" \
            --from-literal=AEGISCORE_PQC_KEY_BASE64="$AEGISCORE_PQC_KEY_BASE64" \
            --from-literal=Governance__FeedbackEncryptionKeyBase64="$Governance__FeedbackEncryptionKeyBase64" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml -f k8s/postgres-statefulset.yaml -f k8s/postgres-service.yaml -f k8s/redis-deployment.yaml -f k8s/redis-service.yaml -f k8s/network-policy.yaml
          sed "s|\${GITHUB_REPOSITORY}|${{ github.repository }}|g; s|\${IMAGE_TAG}|${IMAGE_TAG}|g" k8s/api-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/api-service.yaml -f k8s/api-hpa.yaml -f k8s/api-pdb.yaml -f k8s/ingress.yaml
          kubectl -n aegiscore rollout status deploy/aegiscore-api --timeout=180s
