# ─── Prometheus Alerting Rules ────────────────────────
groups:
  - name: aegiscore-critical
    interval: 30s
    rules:
      - alert: AppDown
        expr: up{service="api"} == 0
        for: 1m
        labels: { severity: critical, channel: slack-page }
        annotations:
          summary: "AegisCore API is DOWN"
          description: "The API health check has been failing for over 1 minute."

      - alert: DatabaseUnreachable
        expr: pg_up == 0
        for: 2m
        labels: { severity: critical, channel: slack-page }
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "PostgreSQL health check has been failing for over 2 minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels: { severity: critical, channel: slack-page }
        annotations:
          summary: "Error rate above 5%"
          description: "{{ $value | humanizePercentage }} error rate over 5 minutes."

      - alert: HighMemory
        expr: process_memory_bytes / 1e9 > 1.8
        for: 5m
        labels: { severity: critical, channel: slack-page }
        annotations:
          summary: "Memory usage above 90% (1.8GB of 2GB limit)"
          description: "Current: {{ $value | humanize }}B"

      - alert: DiskSpaceLow
        expr: disk_free_percent{mountpoint="/"} < 10
        for: 5m
        labels: { severity: critical, channel: slack-page }
        annotations:
          summary: "Disk space critically low"
          description: "{{ $value }}% free remaining."

  - name: aegiscore-warning
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels: { severity: warning, channel: slack-notify }
        annotations:
          summary: "p95 response time above 2s"
          description: "{{ $value }}s over 10 minutes."

      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[15m]) / rate(cache_requests_total[15m]) < 0.70
        for: 15m
        labels: { severity: warning, channel: slack-notify }
        annotations:
          summary: "Cache hit rate below 70%"
          description: "{{ $value | humanizePercentage }} over 15 minutes."

      - alert: RedisUnreachable
        expr: redis_up == 0
        for: 5m
        labels: { severity: warning, channel: slack-notify }
        annotations:
          summary: "Redis is unreachable"
          description: "App is running but Redis health check failing."

      - alert: AttackWarning
        expr: rate(auth_failures_total[1m]) > 50
        for: 1m
        labels: { severity: warning, channel: slack-notify }
        annotations:
          summary: "Possible brute force attack — 50+ failed logins/min"
          description: "{{ $value }} failed attempts per minute."

      - alert: RateLimitFrequent
        expr: rate(rate_limit_hits_total[10m]) > 10
        for: 10m
        labels: { severity: warning, channel: slack-notify }
        annotations:
          summary: "IP repeatedly hitting rate limits"
          description: "Consider manual block."
