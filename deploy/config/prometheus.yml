# ─── Prometheus Configuration ────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    app: aegiscore

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aegiscore-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - aegiscore-api:8080
        labels:
          service: api
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - caddy:2019
        labels:
          service: caddy

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
