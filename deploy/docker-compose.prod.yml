# ─── AegisCore Production docker-compose ─────────────────
# Full stack: API, Portal, PostgreSQL, Redis, PgBouncer, Caddy, Prometheus, Grafana
# All services on internal network. Only Caddy exposed.

name: aegiscore-prod
services:
  caddy:
    image: caddy:2.9-alpine
    container_name: aegiscore-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /data/caddy

  api:
    image: ${AEGISCORE_API_IMAGE:-ghcr.io/nocturnesystems/aegiscore-api:latest}
    container_name: aegiscore-api
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      Runtime__DemoMode: "false"
      Database__AutoMigrate: "true"
      Deployment__FailOnReadinessError: "true"
      AEGISCORE_CLOUD_PROVIDER: ${AEGISCORE_CLOUD_PROVIDER:-AZURE}
      AEGISCORE_SECRET_PROVIDER: ${AEGISCORE_SECRET_PROVIDER:-AZURE}
      TENANT_ID: ${TENANT_ID}
      DB_HOST: ${DB_HOST:-pgbouncer}
      DB_PORT: ${DB_PORT:-6432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-aegiscore}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-aegiscore}}
      DB_PASS: ${DB_PASS:-${POSTGRES_PASSWORD}}
      AEGISCORE_DB_CONNECTION: Host=pgbouncer;Port=6432;Database=${POSTGRES_DB:-aegiscore};Username=${POSTGRES_USER:-aegiscore};Password=${POSTGRES_PASSWORD};SslMode=Require;Trust Server Certificate=true;Pooling=false
      AEGISCORE_REDIS_CONNECTION: redis:6379,password=${REDIS_PASSWORD}
      AEGISCORE_STORAGE_PROVIDER: ${AEGISCORE_STORAGE_PROVIDER:-s3}
      License__ServerUrl: ${LICENSE_SERVER_URL}
      License__HmacSecret: ${LICENSE_HMAC_SECRET}
      AEGISCORE_ENCRYPTION_KEY: ${AEGISCORE_ENCRYPTION_KEY}
      PQC_MLKEM_PUBLIC_KEY: ${PQC_MLKEM_PUBLIC_KEY}
      PQC_MLKEM_PRIVATE_KEY: ${PQC_MLKEM_PRIVATE_KEY}
      PQC_MLDSA_PUBLIC_KEY: ${PQC_MLDSA_PUBLIC_KEY}
      PQC_MLDSA_PRIVATE_KEY: ${PQC_MLDSA_PRIVATE_KEY}
      CF_TURNSTILE_SITE_KEY: ${CF_TURNSTILE_SITE_KEY}
      CF_TURNSTILE_SECRET_KEY: ${CF_TURNSTILE_SECRET_KEY}
      APP_URL: ${APP_URL}
      APP_ENV: ${APP_ENV:-Production}
      APP_SECRET: ${APP_SECRET}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-900}
      AEGISCORE_SETUP_TOKEN: ${AEGISCORE_SETUP_TOKEN}
      AEGISCORE_PQC_KEY_BASE64: ${AEGISCORE_PQC_KEY_BASE64}
      AEGISCORE_JWT_SECRET: ${AEGISCORE_JWT_SECRET}
      Governance__FeedbackEncryptionKeyBase64: ${GOVERNANCE_FEEDBACK_KEY_BASE64}
      DataProtection__KeyPath: /app/config/data-protection
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_ENDPOINT: ${AI_ENDPOINT}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
      EMAIL__SmtpHost: ${SMTP_HOST}
      EMAIL__SmtpPort: ${SMTP_PORT:-587}
      EMAIL__Username: ${SMTP_USERNAME}
      EMAIL__Password: ${SMTP_PASSWORD}
      WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN}
      WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID}
      PowerBi__EmbedToken: ${POWERBI_EMBED_TOKEN}
      PowerBi__TokenMinutes: "30"
      Kestrel__MaxRequestBodySize: "52428800"
      DOTNET_gcServer: "1"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - api_storage:/app/storage
      - api_config:/app/config
      - api_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  portal:
    image: ${AEGISCORE_PORTAL_IMAGE:-ghcr.io/nocturnesystems/aegiscore-portal:latest}
    container_name: aegiscore-portal
    build:
      context: ../AegisCore.Portal
    environment:
      AEGISCORE_API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  pgbouncer:
    image: edoburu/pgbouncer:1.23
    container_name: aegiscore-pgbouncer
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiscore}
      POSTGRES_USER: ${POSTGRES_USER:-aegiscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-aegiscore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aegiscore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiscore}
      POSTGRES_USER: ${POSTGRES_USER:-aegiscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector
      - -c
      - statement_timeout=30000
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=10000
      - -c
      - log_min_duration_statement=1000
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegiscore} -d ${POSTGRES_DB:-aegiscore}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine3.21
    container_name: aegiscore-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "volatile-lru"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.2
    container_name: aegiscore-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.5
    container_name: aegiscore-grafana
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  api_storage:
  api_config:
  api_logs:
  prometheus_data:
  grafana_data:
