name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: ./gradlew build
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-android
          path: app/build/outputs/
