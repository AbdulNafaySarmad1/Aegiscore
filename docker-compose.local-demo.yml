services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegiscore
      POSTGRES_USER: aegiscore
      POSTGRES_PASSWORD: aegiscore-demo-local
      APP_DB_USER: aegiscore
      APP_DB_PASSWORD: aegiscore-demo-local
    volumes:
      - aegiscore_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegiscore -d aegiscore"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Demo"
      AEGISCORE_INSTALLATION_COMPLETED: "true"
      AEGISCORE_DB_CONNECTION: "Host=postgres;Port=5432;Database=aegiscore;Username=aegiscore;Password=aegiscore-demo-local;SslMode=Disable"
      Demo__UseEnsureCreated: "true"
      Demo__SeedGoldenUniverse: "true"
      Demo__AllowExplicitExternalSeed: "false"
      Runtime__DemoMode: "true"
      Deployment__FailOnReadinessError: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  aegiscore_demo_postgres:
