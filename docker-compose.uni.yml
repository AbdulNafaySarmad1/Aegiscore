version: "3.8"
services:
  aegiscore-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: aegiscore-api:prod
    container_name: aegiscore-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - AEGISCORE_CLOUD_PROVIDER=${AEGISCORE_CLOUD_PROVIDER:-ONPREMISE}
      - TENANT_ID=${TENANT_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-redis:6379}
      - JWT_AUTHORITY=${JWT_AUTHORITY}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-aegiscore-api}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY}
      - AI_OPENAI_BASE_URL=${AI_OPENAI_BASE_URL:-https://api.openai.com/v1/}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-AegisCore}
      - AZURE_KEY_VAULT_URL=${AZURE_KEY_VAULT_URL}
      - AEGISCORE_API_URL=${AEGISCORE_API_URL}
      - AEGISCORE_FRONTEND_URL=${AEGISCORE_FRONTEND_URL}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"
    volumes:
      - api_logs:/app/logs
      - api_backups:/app/backups
    networks:
      - aegis-internal

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aegiscore-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aegiscore}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-aegiscore}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegiscore} -d ${POSTGRES_DB:-aegiscore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    command: >
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=500
      -c max_connections=100
    networks:
      - aegis-internal

  redis:
    image: redis:7-alpine
    container_name: aegiscore-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - aegis-internal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: aegiscore-elasticsearch
    restart: unless-stopped
    profiles: ["search"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - aegis-internal

  minio:
    image: minio/minio:latest
    container_name: aegiscore-minio
    restart: unless-stopped
    profiles: ["onpremise"]
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - aegis-internal

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aegiscore-tunnel
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - aegis-internal

networks:
  aegis-internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  es_data:
  minio_data:
  api_logs:
  api_backups:
