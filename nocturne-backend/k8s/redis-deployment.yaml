apiVersion: apps/v1
kind: Deployment
metadata:
  name: nocturne-redis
  namespace: nocturne
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nocturne-redis
  template:
    metadata:
      labels:
        app: nocturne-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
