apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nocturne-api
  namespace: nocturne
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nocturne.university.edu.pk
      secretName: nocturne-api-tls
  rules:
    - host: api.nocturne.university.edu.pk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nocturne-api
                port:
                  number: 80
